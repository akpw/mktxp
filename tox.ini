[tox]
envlist =
    py3{14,13,12,11,10}
skip_missing_interpreters = true

[testenv]
package = wheel
wheel_build_env = .pkg
envtmpdir = {toxworkdir}/tmp/{envname}
constrain_package_deps = true
use_frozen_constraints = true
extras =
    test

commands = pytest -v --tb=short --basetemp={envtmpdir} {posargs}
